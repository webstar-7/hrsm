<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeopleDesk</title>
<meta name="theme-color" content="#0E4142">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E4142'/%3E%3Cpath d='M7 11h7l2 2.4h9V24H7z' fill='%23F0B429'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16262B; --muted:#5A6A6F; --line:#DCE3E5; --bg:#F3F6F6; --panel:#FFFFFF;
  --spruce:#0E4142; --spruce-hi:#175759; --spruce-deep:#092C2D; --gold:#F0B429; --sage:#E4EFEC;
  --ok:#1E7A4C; --ok-bg:#E1F2E8; --warn:#7F5400; --warn-bg:#FCEFC8; --bad:#A3392B; --bad-bg:#F9E2DE;
  --neutral:#485A60; --neutral-bg:#E7ECED;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;letter-spacing:-.01em;font-weight:700}
h1{font-size:28px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
a{color:var(--spruce-hi);text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
code{background:var(--neutral-bg);padding:1px 6px;border-radius:4px;font-size:.9em}
:focus-visible{outline:2px solid var(--spruce-hi);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#F6F9F9;border-color:#C4CFD2}
.btn.primary{background:var(--spruce);border-color:var(--spruce);color:#fff}
.btn.primary:hover{background:var(--spruce-hi);border-color:var(--spruce-hi)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--neutral-bg)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--neutral-bg);color:var(--ink)}
.icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* chips + avatars */
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.neutral{background:var(--neutral-bg);color:var(--neutral)}
.avatar{--h:180;flex:none;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:hsl(var(--h) 38% 86%);color:hsl(var(--h) 48% 24%);font-weight:700;font-size:13px}
.avatar.lg{width:64px;height:64px;font-size:22px;font-family:var(--font-display)}
.who{display:flex;align-items:center;gap:12px}
.who .name{font-weight:600;color:var(--ink);text-decoration:none}
.who .name:hover{text-decoration:underline}

/* panels + tables */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.panel.pad{padding:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-body{padding:20px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #EAEFF0;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-action]{cursor:pointer}
tbody tr[data-action]:hover td{background:#F7FAFA}
td.right,th.right{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* forms */
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>span{font-weight:600;font-size:14px}
.fld input,.fld select,.fld textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid #C9D3D6;border-radius:8px;background:#fff}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--spruce-hi);outline-offset:0;border-color:var(--spruce-hi)}
.fld input:disabled,.fld select:disabled{background:#F1F4F5;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.help{font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.check input{width:18px;height:18px}
.form-error{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.toolbar input,.toolbar select{min-height:38px;padding:6px 12px;border:1px solid #C9D3D6;border-radius:8px;background:#fff}
.toolbar .search{flex:1 1 220px;min-width:180px}

/* app shell */
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:var(--spruce);color:#D5E4E1;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.side :focus-visible{outline-color:var(--gold)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px;padding:0 8px 18px}
.orgbox{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:var(--spruce-deep)}
.orgbox .label{font-size:12px;color:#9DBBB6}
.orgbox .oname{font-weight:600;color:#fff;overflow-wrap:anywhere}
.orgbox select{width:100%;margin-top:6px;background:transparent;color:#fff;border:1px solid #2E6465;border-radius:6px;padding:5px 8px}
.orgbox select option{color:#111}
.nav{display:grid;gap:2px;flex:1;align-content:start}
.navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#D5E4E1;background:transparent;border:0;text-align:left;cursor:pointer;font-weight:500;position:relative}
.navitem:hover{background:var(--spruce-hi);color:#fff}
.navitem[aria-current=page]{background:var(--spruce-hi);color:#fff;font-weight:600}
.navitem[aria-current=page]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.mecard{border-top:1px solid #23595A;padding-top:14px;display:flex;align-items:center;gap:10px}
.mecard .avatar{background:#23595A;color:#fff}
.mecard .who-txt{min-width:0;flex:1}
.mecard .em{font-size:13px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mecard .rl{font-size:12px;color:#9DBBB6}
.mecard .icon-btn{color:#D5E4E1}
.mecard .icon-btn:hover{background:var(--spruce-hi);color:#fff}
.main{min-width:0}
.mobilebar{display:none}
.page{max-width:1120px;margin:0 auto;padding:32px 32px 64px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* dashboard */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:20px 22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--font-display);font-size:34px;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.grid-main{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:20px}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:150px 1fr 32px;gap:12px;align-items:center;font-size:14px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;background:var(--sage);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--spruce);border-radius:99px}
.bar-row .n{text-align:right;font-weight:600}
.attn{list-style:none;margin:0;padding:0;display:grid}
.attn li{border-bottom:1px solid #EAEFF0}
.attn li:last-child{border-bottom:0}
.attn button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px 0;cursor:pointer}
.attn button:hover .an{text-decoration:underline}
.meter{height:8px;border-radius:99px;background:var(--sage);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--gold)}

/* employee file (folder tabs) */
.profile-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 20px}
.profile-head .grow{flex:1;min-width:200px}
.folder-tabs{display:flex;gap:4px;padding-left:16px;margin-bottom:-1px;position:relative;z-index:1;flex-wrap:wrap}
.folder-tab{border:1px solid var(--line);border-bottom:1px solid var(--line);background:#E8EEEF;padding:10px 20px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);font-weight:600}
.folder-tab:hover{color:var(--ink)}
.folder-tab[aria-selected=true]{background:var(--panel);color:var(--ink);border-bottom-color:var(--panel);box-shadow:inset 0 3px 0 var(--gold)}
.folder-body{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;min-height:220px}
.dl{display:grid;grid-template-columns:200px 1fr;margin:0}
.dl dt,.dl dd{padding:11px 0;border-bottom:1px solid #EAEFF0;margin:0}
.dl dt{color:var(--muted);font-size:14px}
.dl dd{overflow-wrap:anywhere}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
.sect-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:32px}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(340px,1.05fr) minmax(340px,1fr)}
.auth-art{background:var(--spruce);color:#D5E4E1;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.auth-art h2{font-size:clamp(30px,3.6vw,46px);color:#fff;max-width:13em;line-height:1.08}
.auth-art ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px;max-width:32em}
.auth-art li{display:flex;gap:12px;align-items:flex-start}
.auth-art li svg{flex:none;margin-top:3px;color:var(--gold)}
.auth-art .art{width:min(360px,80%);align-self:flex-end;opacity:.95}
.auth-panel{display:grid;place-items:center;padding:32px}
.auth-card{width:min(420px,100%)}
.auth-card h1{margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin-bottom:22px}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.auth-links button{background:none;border:0;padding:0;color:var(--spruce-hi);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.auth-card .btn.primary{width:100%;justify-content:center}
.center-screen{min-height:100vh;display:grid;place-content:center;gap:14px;justify-items:center;padding:24px;color:var(--muted);text-align:center}
.center-screen .panel{max-width:520px;text-align:left;display:grid;gap:12px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--sage);border-top-color:var(--spruce);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadline{padding:36px;text-align:center;color:var(--muted)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(9,44,45,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s ease-out}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(9,44,45,.3)}
.modal.wide{width:min(720px,100%)}
.modal form{display:flex;flex-direction:column;min-height:0}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--spruce-deep);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .15s ease-out}
.toast.error{background:var(--bad)}
textarea.copybox{width:100%;min-height:170px;padding:12px;border:1px solid #C9D3D6;border-radius:8px;font:14px/1.5 var(--font-body)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .shell.menu-open .side{transform:none}
  .shell.menu-open::after{content:"";position:fixed;inset:0;background:rgba(9,44,45,.4);z-index:30}
  .shell.menu-open .side{z-index:40}
  .mobilebar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--spruce);color:#fff;position:sticky;top:0;z-index:20}
  .mobilebar .icon-btn{color:#fff}
  .mobilebar .brand{padding:0;font-size:18px}
  .page{padding:20px 16px 56px}
  .stat-strip{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid-main,.two-col{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .dl dt{border-bottom:0;padding-bottom:0}
  .auth{grid-template-columns:1fr}
  .auth-art{padding:28px 24px}
  .auth-art .art,.auth-art ul{display:none}
  .grid2{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr 28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   SETTINGS: the only lines you normally need to change
   ===================================================================== */
const CONFIG = {
  APP_NAME: 'PeopleDesk',                       // your product name
  SUPABASE_URL: 'https://efgckodcvtzrjiabcktf.supabase.co',
  SUPABASE_KEY: 'sb_publishable_Kd560On82iHu2UadJow4lQ_BLP1Hr4L', // publishable key: safe to be public
  SUPPORT_EMAIL: ''                             // shown on the "workspace locked" screen
};

if (!window.supabase) {
  document.getElementById('app').innerHTML =
    '<div style="padding:32px;font-family:system-ui">Could not load the app library. Check your internet connection and reload the page.</div>';
  return;
}
document.title = CONFIG.APP_NAME;
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
const hr = sb.schema('hrms');

/* =====================================================================
   CONSTANTS
   ===================================================================== */
const EMP_TYPES = { full_time:'Full-time', part_time:'Part-time', contract:'Contract', casual:'Casual', intern:'Intern', volunteer:'Volunteer' };
const STATUSES = { active:'Active', on_leave:'On leave', suspended:'Suspended', resigned:'Resigned', terminated:'Terminated', retired:'Retired' };
const EXITED = ['resigned','terminated','retired'];
const CONTRACT_TYPES = { permanent:'Permanent', fixed_term:'Fixed-term', probation:'Probation', casual:'Casual', internship:'Internship', volunteer:'Volunteer' };
const CONTRACT_STATUSES = { draft:'Draft', active:'Active', expired:'Expired', terminated:'Terminated' };
const PAY_FREQ = { monthly:'Monthly', weekly:'Weekly', daily:'Daily', hourly:'Hourly' };
const DOC_TYPES = { contract:'Contract', certificate:'Certificate', id_document:'ID document', cv:'CV or résumé', appraisal:'Appraisal', disciplinary:'Disciplinary', other:'Other' };
const ROLES = { owner:'Owner', admin:'Admin', hr_officer:'HR officer', payroll:'Payroll', employee:'Employee' };
const ROLE_HELP = {
  admin:'Full access to HR data, team and settings.',
  hr_officer:'Manages employees, contracts and documents.',
  payroll:'Can view pay and personal details, but cannot edit.',
  employee:'Sees their own record, and their team if they manage people.'
};
const INDUSTRIES = ['Education','Healthcare','Retail','Finance','Technology','Manufacturing','Hospitality','Construction','Non-profit','Government','Other'];
const GENDERS = { Female:'Female', Male:'Male', Other:'Other' };
const MARITAL = { Single:'Single', Married:'Married', Divorced:'Divorced', Widowed:'Widowed', Other:'Other' };
const TABLE_LABEL = { employees:'Employee', employee_private:'Personal details', contracts:'Contract', employee_documents:'Document',
  departments:'Department', positions:'Position', org_members:'Team member', invitations:'Invitation', organizations:'Organization' };
const ACTION_LABEL = { INSERT:'Added', UPDATE:'Changed', DELETE:'Removed' };
const SENSITIVE = new Set(['national_id_no','tax_id_no','social_security_no','home_address','date_of_birth']);

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  user:null, memberships:[], org:null, role:null, me:null,
  view:'dashboard', empId:null, tab:'overview', menuOpen:false,
  departments:[], positions:[], employees:[], contracts:[], attention:{ docs:[] },
  detail:{ id:null, priv:null, docs:[], loaded:false, error:null },
  team:{ members:[], invitations:[], loaded:false, loading:false, error:null },
  audit:{ rows:[], loaded:false, loading:false, error:null },
  filters:{ q:'', dept:'', status:'current' },
  authMode:'signin', pendingEmail:'', joined:0,
  recovery:/type=recovery/.test(location.hash)
};

/* =====================================================================
   UTILITIES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localISO = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const TODAY = () => localISO(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return localISO(d); };
const fmtDate = v => { if (!v) return '—'; const s = String(v); const d = new Date(s.length === 10 ? s + 'T00:00:00' : s); return isNaN(d) ? '—' : d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }); };
const fmtDateTime = v => { const d = new Date(v); return isNaN(d) ? '—' : d.toLocaleString(undefined, { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); };
const money = (n, cur) => {
  if (n == null || n === '') return '—';
  try { return new Intl.NumberFormat(undefined, { style:'currency', currency: cur || state.org?.currency || 'USD' }).format(n); }
  catch { return `${cur || ''} ${Number(n).toLocaleString()}`.trim(); }
};
const initials = name => (String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
const hue = name => { let h = 0; for (const c of String(name || '')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (name, size = '') => `<span class="avatar ${size}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
const chip = (text, tone = 'neutral') => `<span class="chip ${tone}">${esc(text)}</span>`;
const statusTone = s => ({ active:'ok', on_leave:'warn', suspended:'warn', terminated:'bad' }[s] || 'neutral');
const nz = v => (v == null || v === '') ? '—' : esc(v);

const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

function friendly(err) {
  const m = String(err?.message || err || 'Something went wrong.');
  const has = re => re.test(m);
  if (err?.code === '42501' || has(/permission denied|row-level security/i)) return "You don't have permission to do that.";
  if (has(/employees_org_empno_uq/)) return 'That employee number is already in use.';
  if (has(/contracts_one_active_uq/)) return 'This employee already has an active contract. End it first, or save this one as a draft.';
  if (has(/invitations_one_pending_uq/)) return 'That email already has a pending invitation.';
  if (has(/departments_org_id_name_key/)) return 'A department with that name already exists.';
  if (has(/positions_org_id_title_key/)) return 'A position with that title already exists.';
  if (has(/employees_exit_after_hire/)) return 'The exit date must be on or after the hire date.';
  if (has(/contracts_dates/)) return 'The end date must be on or after the start date.';
  if (has(/Failed to fetch|NetworkError|Load failed/i)) return "Can't reach the server. Check your internet connection and try again.";
  return m;
}

function formToObj(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'file') o[el.name] = el.files[0] || null;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.type === 'password') o[el.name] = el.value;
    else o[el.name] = el.value.trim() === '' ? null : el.value.trim();
  }
  return o;
}

function tzOptions(selected) {
  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch {}
  if (!zones.includes('UTC')) zones = ['UTC', ...zones];
  if (selected && !zones.includes(selected)) zones = [selected, ...zones];
  return zones.map(z => `<option value="${esc(z)}"${z === selected ? ' selected' : ''}>${esc(z)}</option>`).join('');
}

async function loadMemberships() {
  const members = await q(hr.from('org_members').select('id,org_id,role,status,display_name').eq('user_id', state.user.id));
  const ids = members.map(m => m.org_id);
  const orgs = ids.length ? await q(hr.from('organizations').select('*').in('id', ids)) : [];
  const byId = Object.fromEntries(orgs.map(o => [o.id, o]));
  state.memberships = members.filter(m => byId[m.org_id]).map(m => ({ ...m, org: byId[m.org_id] }));
}
async function loadOrgData() {
  const oid = state.org.id, p = perms();
  const [departments, positions, employees, contracts] = await Promise.all([
    q(hr.from('departments').select('*').eq('org_id', oid).order('name')),
    q(hr.from('positions').select('*').eq('org_id', oid).order('title')),
    q(hr.from('employees').select('*').eq('org_id', oid).order('full_name')),
    q(hr.from('contracts').select('*').eq('org_id', oid))
  ]);
  Object.assign(state, { departments, positions, employees, contracts });
  state.me = employees.find(e => e.user_id === state.user.id) || null;
  state.attention = { docs: [] };
  if (p.hr) {
    try {
      state.attention.docs = await q(hr.from('employee_documents').select('id,employee_id,title,expires_on')
        .eq('org_id', oid).not('expires_on', 'is', null).lte('expires_on', addDays(TODAY(), 60)).order('expires_on'));
    } catch {}
  }
}
async function reloadEmployees() {
  state.employees = await q(hr.from('employees').select('*').eq('org_id', state.org.id).order('full_name'));
  state.me = state.employees.find(e => e.user_id === state.user.id) || null;
}
async function reloadStructure() {
  [state.departments, state.positions] = await Promise.all([
    q(hr.from('departments').select('*').eq('org_id', state.org.id).order('name')),
    q(hr.from('positions').select('*').eq('org_id', state.org.id).order('title'))
  ]);
}
async function reloadContracts() { state.contracts = await q(hr.from('contracts').select('*').eq('org_id', state.org.id)); }

async function loadDetail(id) {
  const e = findEmp(id), p = perms();
  const self = !!e && e.user_id === state.user.id;
  const d = state.detail = { id, priv:null, docs:[], loaded:false, error:null };
  try {
    const jobs = [];
    if (p.pay || self) jobs.push(hr.from('employee_private').select('*').eq('employee_id', id).maybeSingle().then(r => { if (r.error) throw r.error; d.priv = r.data; }));

/* =====================================================================
   VIEW: DASHBOARD
   ===================================================================== */
function viewDashboard() {
  const p = perms();
  const current = state.employees.filter(e => !EXITED.includes(e.status));
  const onLeave = current.filter(e => e.status === 'on_leave').length;
  const since = addDays(TODAY(), -30), since90 = addDays(TODAY(), -90);
  const joined = current.filter(e => e.hire_date && e.hire_date >= since).length;
  const left = state.employees.filter(e => EXITED.includes(e.status) && e.exit_date && e.exit_date >= since90).length;
  const add = p.hr ? `<button class="btn primary" data-action="add-emp">${icon('plus')} Add employee</button>` : '';
  if (!state.employees.length) {
    return pageHead('Dashboard', state.org.name, add) + `<div class="panel empty"><h3>No employees yet</h3><p>Add your first employee to start building your people records.</p>${p.hr ? `<button class="btn primary" data-action="add-emp">${icon('plus')} Add employee</button>` : ''}</div>`;
  }
  const counts = {};
  current.forEach(e => { const k = e.department_id ? deptName(e.department_id) : 'No department'; counts[k] = (counts[k] || 0) + 1; });
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  const bars = rows.map(([k, n]) => `<div class="bar-row"><span class="lbl" title="${esc(k)}">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n / max * 100)}%"></div></div><span class="n">${n}</span></div>`).join('');

  const today = TODAY(), soon = addDays(today, 60), att = [];
  if (p.pay) state.contracts.filter(c => c.status === 'active' && c.end_date && c.end_date <= soon).forEach(c => {
    att.push({ date:c.end_date, emp:c.employee_id, text:'Contract', late:c.end_date < today });
  });
  if (p.hr) state.attention.docs.forEach(d => att.push({ date:d.expires_on, emp:d.employee_id, text:d.title, late:d.expires_on < today }));
  att.sort((a, b) => a.date.localeCompare(b.date));
  const attn = att.length ? `<ul class="attn">${att.slice(0, 8).map(a => `<li><button data-action="open-emp" data-id="${esc(a.emp)}"><span><span class="an">${esc(findEmp(a.emp)?.full_name || 'Employee')}</span><br><span class="muted small">${esc(a.text)} ${a.late ? 'expired' : 'expires'} ${esc(fmtDate(a.date))}</span></span>${chip(a.late ? 'Overdue' : 'Soon', a.late ? 'bad' : 'warn')}</button></li>`).join('')}</ul>`
    : `<p class="muted">Nothing needs attention in the next 60 days.</p>`;

  const o = state.org;
  const cap = o.max_employees;
  const used = current.length;
  const daysLeft = o.trial_ends_at ? Math.max(0, Math.ceil((new Date(o.trial_ends_at) - new Date()) / 86400000)) : null;
  const plan = p.admin ? `<div class="panel pad" style="margin-top:20px"><h3 style="margin-bottom:6px">Your plan</h3>
    <p>${o.status === 'trial' ? `Free trial${daysLeft != null ? `, ${daysLeft} day${daysLeft === 1 ? '' : 's'} left` : ''}` : esc(o.plan_key)}</p>
    <div class="meter" role="img" aria-label="${used} of ${cap ?? 'unlimited'} employees"><i style="width:${cap ? Math.min(100, Math.round(used / cap * 100)) : 0}%"></i></div>
    <p class="muted small">${used} of ${cap ?? 'unlimited'} employees used</p></div>` : '';

  return pageHead('Dashboard', state.org.name, add) + `
  <div class="panel stat-strip">
    <div class="stat"><b>${current.length}</b><span>People employed</span></div>
    <div class="stat"><b>${onLeave}</b><span>On leave now</span></div>
    <div class="stat"><b>${joined}</b><span>Joined in 30 days</span></div>
    <div class="stat"><b>${left}</b><span>Left in 90 days</span></div>
  </div>
  <div class="grid-main">
    <section class="panel pad"><h3 style="margin-bottom:16px">People by department</h3><div class="bars">${bars || '<p class="muted">No data yet.</p>'}</div></section>
    <div><section class="panel pad"><h3 style="margin-bottom:8px">Needs attention</h3>${attn}</section>${plan}</div>
  </div>`;
}

function employeeList(reportsOnly) {
  const f = state.filters, term = (f.q || '').toLowerCase();
  return state.employees.filter(e => {
    if (reportsOnly && (!state.me || e.manager_id !== state.me.id)) return false;
    if (f.dept && e.department_id !== f.dept) return false;
    if (f.status === 'current' && EXITED.includes(e.status)) return false;
    if (f.status === 'exited' && !EXITED.includes(e.status)) return false;
    if (['active', 'on_leave', 'suspended'].includes(f.status) && e.status !== f.status) return false;
    if (term && !`${e.full_name} ${e.employee_no || ''} ${e.work_email || ''} ${e.phone || ''}`.toLowerCase().includes(term)) return false;
    return true;
  });
}

      const path = `${state.org.id}/${id}/${Date.now()}-${file.name.replace(/[^\w.\-]+/g, '_')}`;
      const up = await sb.storage.from('hr-documents').upload(path, file, { contentType: file.type || undefined, upsert:false });
      if (up.error) throw up.error;
      const ins = await hr.from('employee_documents').insert({ employee_id:id, doc_type:d.doc_type, title:d.title, storage_path:path, expires_on:d.expires_on, visible_to_employee:d.visible_to_employee });
      if (ins.error) { await sb.storage.from('hr-documents').remove([path]); throw ins.error; }
      await loadDetail(id);
      try { state.attention.docs = await q(hr.from('employee_documents').select('id,employee_id,title,expires_on').eq('org_id', state.org.id).not('expires_on', 'is', null).lte('expires_on', addDays(TODAY(), 60)).order('expires_on')); } catch {}
      toast('Document uploaded.');
    }
  });
}

const humanKey = k => k.replace(/_/g, ' ');
const shortVal = v => v == null ? 'empty' : (typeof v === 'object' ? JSON.stringify(v) : String(v)).slice(0, 40);
function diffSummary(r) {
  const o = r.old_data || {}, n = r.new_data || {};
  if (r.action === 'UPDATE') {
    const keys = Object.keys(n).filter(k => k !== 'updated_at' && JSON.stringify(n[k]) !== JSON.stringify(o[k]));
    if (!keys.length) return 'No visible change';
    return keys.map(k => SENSITIVE.has(k) ? `${humanKey(k)} changed` : `${humanKey(k)}: ${shortVal(o[k])} to ${shortVal(n[k])}`).join('; ');
  }
  const src = r.action === 'DELETE' ? o : n;
  return src.full_name || src.name || src.title || src.email || '';
}

/* =====================================================================
   CSV EXPORT
   ===================================================================== */
function exportCsv() {
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ['Employee number','Full name','Gender','Work email','Phone','Department','Position','Reports to','Employment type','Status','Hire date','Exit date'];
  const rows = state.employees.map(e => [e.employee_no, e.full_name, e.gender, e.work_email, e.phone, e.department_id ? deptName(e.department_id) : '',
    e.position_id ? posTitle(e.position_id) : '', e.manager_id ? findEmp(e.manager_id)?.full_name : '', EMP_TYPES[e.employment_type], STATUSES[e.status], e.hire_date, e.exit_date]);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `employees-${TODAY()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  },
  settings: async d => {
    await q(hr.from('organizations').update({ name:d.name, industry:d.industry, country:d.country, timezone:d.timezone }).eq('id', state.org.id));
    await loadMemberships();
    state.org = state.memberships.find(m => m.org_id === state.org.id).org;
    toast('Settings saved.'); renderShell();
  }
};
document.addEventListener('submit', async e => {
  const form = e.target, kind = form.dataset?.form; if (!kind) return;
  e.preventDefault();
  const btn = form.querySelector('button[type=submit]');
  const errBox = form.querySelector('.form-error'); if (errBox) errBox.hidden = true;
  if (btn) btn.disabled = true;
  try {
    if (kind === 'modal') { if (modalSubmit) { await modalSubmit(formToObj(form), form); closeModal(); } }
    else if (forms[kind]) await forms[kind](formToObj(form), form);
  } catch (err) { showFormError(form, friendly(err)); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* =====================================================================
   SESSION + BOOT
   ===================================================================== */
function resetSession() {
  Object.assign(state, { user:null, memberships:[], org:null, role:null, me:null, employees:[], departments:[], positions:[], contracts:[], view:'dashboard', authMode:'signin', menuOpen:false });
  closeModal();
}
function renderChooser() {
  $('#app').innerHTML = `<div class="center-screen"><div class="panel pad"><h2>Choose an organization</h2>${state.memberships.map(m => `<button class="btn" data-action="pick-org" data-id="${esc(m.org_id)}">${esc(m.org.name)}</button>`).join('')}</div></div>`;
}
actions['pick-org'] = el => enterOrg(el.dataset.id);

async function enterOrg(orgId) {
  const m = state.memberships.find(x => x.org_id === orgId); if (!m) return;
  state.org = m.org; state.role = m.role;
  try { localStorage.setItem('hrms_org', orgId); } catch {}
  state.team = { members:[], invitations:[], loaded:false, loading:false, error:null };
  state.audit = { rows:[], loaded:false, loading:false, error:null };
  state.filters = { q:'', dept:'', status:'current' };
  if (!orgUsable(state.org)) { renderLocked(); return; }
  renderLoading('Loading your workspace');
  try { await loadOrgData(); } catch (err) { renderFatal(err); return; }
  go(state.role === 'employee' ? 'me' : 'dashboard');
}

let booting = false, bootTimer = null;
function scheduleBoot() { clearTimeout(bootTimer); bootTimer = setTimeout(boot, 0); }
async function boot() {
  if (booting) return;
  booting = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    state.user = session?.user || null;
    if (!state.user) { renderAuth(); return; }
    if (state.recovery) { renderAuth(); return; }
    renderLoading('Loading your workspace');
    try {
      const inv = await hr.rpc('accept_invitations');
      if (!inv.error && Array.isArray(inv.data) && inv.data.length) state.joined = inv.data.length;
      await loadMemberships();
    } catch (err) { renderFatal(err); return; }
    if (!state.memberships.length) { renderOnboarding(); return; }
    let pick = null; try { pick = localStorage.getItem('hrms_org'); } catch {}
    const m = state.memberships.find(x => x.org_id === pick) || state.memberships[0];
    await enterOrg(m.org_id);
    if (state.joined && state.org) { toast(`You've joined ${state.org.name}.`); state.joined = 0; }
  } catch (err) { renderFatal(err); }
  finally { booting = false; }
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { state.recovery = true; scheduleBoot(); return; }
  if (event === 'SIGNED_OUT') { resetSession(); setTimeout(renderAuth, 0); return; }
  if (event === 'SIGNED_IN' && session && !booting && state.user?.id !== session.user.id) scheduleBoot();
});
boot();
})();
</script>
