<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeopleDesk</title>
<meta name="theme-color" content="#0E4142">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PeopleDesk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E4142'/%3E%3Cpath d='M7 11h7l2 2.4h9V24H7z' fill='%23F0B429'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16262B; --muted:#5A6A6F; --line:#DCE3E5; --bg:#F3F6F6; --panel:#FFFFFF;
  --spruce:#0E4142; --spruce-hi:#175759; --spruce-deep:#092C2D; --gold:#F0B429; --sage:#E4EFEC;
  --ok:#1E7A4C; --ok-bg:#E1F2E8; --warn:#7F5400; --warn-bg:#FCEFC8; --bad:#A3392B; --bad-bg:#F9E2DE;
  --neutral:#485A60; --neutral-bg:#E7ECED;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;letter-spacing:-.01em;font-weight:700}
h1{font-size:28px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
a{color:var(--spruce-hi);text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
code{background:var(--neutral-bg);padding:1px 6px;border-radius:4px;font-size:.9em}
:focus-visible{outline:2px solid var(--spruce-hi);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#F6F9F9;border-color:#C4CFD2}
.btn.primary{background:var(--spruce);border-color:var(--spruce);color:#fff}
.btn.primary:hover{background:var(--spruce-hi);border-color:var(--spruce-hi)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--neutral-bg)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--neutral-bg);color:var(--ink)}
.icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* chips + avatars */
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.neutral{background:var(--neutral-bg);color:var(--neutral)}
.avatar{--h:180;flex:none;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:hsl(var(--h) 38% 86%);color:hsl(var(--h) 48% 24%);font-weight:700;font-size:13px}
.avatar.lg{width:64px;height:64px;font-size:22px;font-family:var(--font-display)}
.who{display:flex;align-items:center;gap:12px}
.who .name{font-weight:600;color:var(--ink);text-decoration:none}
.who .name:hover{text-decoration:underline}

/* panels + tables */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.panel.pad{padding:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-body{padding:20px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #EAEFF0;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-action]{cursor:pointer}
tbody tr[data-action]:hover td{background:#F7FAFA}
td.right,th.right{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* forms */
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>span{font-weight:600;font-size:14px}
.fld input,.fld select,.fld textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid #C9D3D6;border-radius:8px;background:#fff}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--spruce-hi);outline-offset:0;border-color:var(--spruce-hi)}
.fld input:disabled,.fld select:disabled{background:#F1F4F5;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.help{font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.check input{width:18px;height:18px}
.form-error{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.toolbar input,.toolbar select{min-height:38px;padding:6px 12px;border:1px solid #C9D3D6;border-radius:8px;background:#fff}
.toolbar .search{flex:1 1 220px;min-width:180px}

/* app shell */
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:var(--spruce);color:#D5E4E1;display:flex;flex-direction:column;padding:20px 16px 14px;position:sticky;top:0;height:100vh;overflow:hidden}
.side :focus-visible{outline-color:var(--gold)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px;padding:0 8px 14px}
.orgbox{margin:0 0 6px;padding:10px 12px;border-radius:10px;background:var(--spruce-deep)}
.orgbox .label{font-size:12px;color:#9DBBB6}
.orgbox .oname{font-weight:600;color:#fff;overflow-wrap:anywhere}
.orgbox select{width:100%;margin-top:6px;background:transparent;color:#fff;border:1px solid #2E6465;border-radius:6px;padding:5px 8px}
.orgbox select option{color:#111}
.nav{display:grid;gap:1px;flex:1;align-content:start;min-height:0;overflow-y:auto;margin:0 -16px;padding:0 16px 8px;scrollbar-width:thin;scrollbar-color:#2E6465 transparent}
.navgroup{font-size:12px;font-weight:600;color:#8FB0AB;padding:14px 12px 4px}
.navitem{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:#D5E4E1;background:transparent;border:0;text-align:left;cursor:pointer;font-weight:500;position:relative}
.navitem:hover{background:var(--spruce-hi);color:#fff}
.navitem[aria-current=page]{background:var(--spruce-hi);color:#fff;font-weight:600}
.navitem[aria-current=page]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.mecard{border-top:1px solid #23595A;padding-top:12px;margin-top:6px;flex:none;display:flex;align-items:center;gap:10px}
.mecard .avatar{background:#23595A;color:#fff}
.mecard .who-txt{min-width:0;flex:1}
.mecard .em{font-size:13px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mecard .rl{font-size:12px;color:#9DBBB6}
.mecard .icon-btn{color:#D5E4E1}
.mecard .icon-btn:hover{background:var(--spruce-hi);color:#fff}
.main{min-width:0}
.mobilebar{display:none}
.page{max-width:1120px;margin:0 auto;padding:32px 32px 64px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* dashboard */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:20px 22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--font-display);font-size:34px;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.grid-main{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:20px}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;font-size:14px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;background:var(--sage);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--spruce);border-radius:99px}
.bar-row .n{text-align:right;font-weight:600;white-space:nowrap;min-width:32px}
.attn{list-style:none;margin:0;padding:0;display:grid}
.attn li{border-bottom:1px solid #EAEFF0}
.attn li:last-child{border-bottom:0}
.attn button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px 0;cursor:pointer}
.attn button:hover .an{text-decoration:underline}
.meter{height:8px;border-radius:99px;background:var(--sage);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--gold)}

/* employee file (folder tabs) */
.profile-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 20px}
.profile-head .grow{flex:1;min-width:200px}
.folder-tabs{display:flex;gap:4px;padding-left:16px;margin-bottom:-1px;position:relative;z-index:1;flex-wrap:wrap}
.folder-tab{border:1px solid var(--line);border-bottom:1px solid var(--line);background:#E8EEEF;padding:10px 20px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);font-weight:600}
.folder-tab:hover{color:var(--ink)}
.folder-tab[aria-selected=true]{background:var(--panel);color:var(--ink);border-bottom-color:var(--panel);box-shadow:inset 0 3px 0 var(--gold)}
.folder-body{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;min-height:220px}
.dl{display:grid;grid-template-columns:minmax(140px,240px) minmax(0,1fr);margin:0}
.dl dt,.dl dd{padding:11px 0;border-bottom:1px solid #EAEFF0;margin:0}
.dl dt{color:var(--muted);font-size:14px}
.dl dd{overflow-wrap:anywhere}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
.sect-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:32px}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(340px,1.05fr) minmax(340px,1fr)}
.auth-art{background:var(--spruce);color:#D5E4E1;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.auth-art h2{font-size:clamp(30px,3.6vw,46px);color:#fff;max-width:13em;line-height:1.08}
.auth-art ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px;max-width:32em}
.auth-art li{display:flex;gap:12px;align-items:flex-start}
.auth-art li svg{flex:none;margin-top:3px;color:var(--gold)}
.auth-art .art{width:min(360px,80%);align-self:flex-end;opacity:.95}
.auth-panel{display:grid;place-items:center;padding:32px}
.auth-card{width:min(420px,100%)}
.auth-card h1{margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin-bottom:22px}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.auth-links button{background:none;border:0;padding:0;color:var(--spruce-hi);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.auth-card .btn.primary{width:100%;justify-content:center}
.center-screen{min-height:100vh;display:grid;place-content:center;gap:14px;justify-items:center;padding:24px;color:var(--muted);text-align:center}
.center-screen .panel{max-width:520px;text-align:left;display:grid;gap:12px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--sage);border-top-color:var(--spruce);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadline{padding:36px;text-align:center;color:var(--muted)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(9,44,45,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s ease-out}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(9,44,45,.3)}
.modal.wide{width:min(720px,100%)}
.modal form{display:flex;flex-direction:column;min-height:0}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--spruce-deep);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .15s ease-out}
.toast.error{background:var(--bad)}
textarea.copybox{width:100%;min-height:170px;padding:12px;border:1px solid #C9D3D6;border-radius:8px;font:14px/1.5 var(--font-body)}

.badge{margin-left:auto;background:var(--gold);color:var(--spruce-deep);border-radius:99px;padding:0 8px;font-size:12px;font-weight:700;line-height:20px;min-width:20px;text-align:center}
.balances{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.bal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:180px;display:grid;gap:2px;align-content:start}
.bal .lbl{font-weight:600}
.bal b{font-family:var(--font-display);font-size:30px;line-height:1.1}
.clockcard{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 24px;margin-bottom:20px}
.clockcard .big{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.15}
.daypick{display:flex;gap:6px 22px;flex-wrap:wrap;margin-bottom:16px}
.stack>*+*{margin-top:20px}
.photo-box{text-align:center}
#photo-video,#photo-preview{width:100%;max-width:320px;aspect-ratio:1/1;object-fit:cover;border-radius:16px;background:#000;display:block;margin:0 auto 10px}
.photo-box .row{justify-content:center}
[hidden]{display:none!important}
.overlay{z-index:900}
#call-root{position:fixed;z-index:800;left:0;top:0;pointer-events:none}
#call-root>*{pointer-events:auto}
#incoming-call{position:fixed;top:18px;right:18px;width:300px;background:var(--spruce-deep);color:#fff;border-radius:16px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:ring 1.2s ease-in-out infinite}
@keyframes ring{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ic-name{font-family:var(--font-display);font-size:22px;font-weight:700}.ic-sub{color:#B9D0CC;font-size:14px;margin-top:2px}
#rejoin-call{position:fixed;top:18px;right:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
#callscreen{position:fixed;inset:0;width:100vw;height:100vh;background:#0B2A2B;color:#fff;display:flex;flex-direction:column}
.call-top{display:flex;justify-content:space-between;padding:14px 20px;font-size:16px}
.tiles{flex:1;display:grid;gap:10px;padding:0 14px;min-height:0;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));grid-auto-rows:1fr}
.tile{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:0}
.tile video{width:100%;height:100%;object-fit:cover;background:#123}
.tname{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;font-size:14px}
.tstat{display:block;font-size:12px;color:#F2C462}.tstat:empty{display:none}
.thost{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.call-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px}
.cbtn{border:1px solid #2E6465;background:#123A3B;color:#fff;padding:11px 18px;border-radius:12px;cursor:pointer;font-weight:600}
.cbtn.off{background:#5B2A22;border-color:#8A3B2E}.cbtn.leave{background:#B3382A;border-color:#B3382A}.cbtn:disabled{opacity:.4;cursor:not-allowed}
.meet{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:12px}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px;line-height:1}
.xbtn:hover{color:var(--bad)}
.gate{min-height:100vh;background:var(--spruce-deep);color:#fff;padding:20px;display:grid;gap:18px;align-content:start}
.gate-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.gate-org{font-family:var(--font-display);font-size:24px;font-weight:700}
.muted-light{color:#9DBBB6;font-size:14px}
.gate-clock{font-family:var(--font-display);font-size:clamp(34px,6vw,72px);font-weight:700;letter-spacing:.02em}
.gbtn{border:1px solid #2E6465;background:transparent;color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.gbtn[aria-pressed=true]{background:var(--spruce-hi)}
.gseg{border-color:#2E6465;background:transparent}.gseg button{background:transparent;color:#D5E4E1}.gseg button+button{border-color:#2E6465}.gseg button[aria-pressed=true]{background:var(--gold);color:var(--spruce-deep)}
.gate-result{min-height:230px;border-radius:20px;display:grid;place-items:center;text-align:center;padding:26px;gap:14px;grid-auto-flow:column;grid-auto-columns:auto}
.gate-result h2{font-size:clamp(26px,4vw,44px);color:#fff}.gate-result p{font-size:20px;margin-top:4px}
.gate-result.idle{background:rgba(255,255,255,.07)}.gate-result.ok{background:#1E7A4C}.gate-result.dup{background:#8A5A00}.gate-result.bad{background:#A3392B}
.gate-result img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#fff}
.gate-dir{font-family:var(--font-display);font-size:clamp(34px,6vw,64px);font-weight:700;letter-spacing:.06em}
.gate-input{font-size:28px;padding:16px 20px;border-radius:14px;border:0;width:100%;background:#fff;color:var(--ink)}
.gate-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.gate-list li{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:9px 14px;background:rgba(255,255,255,.06);border-radius:10px}
.gate-panel h2{color:#fff;margin-bottom:10px}
.notice{background:#FFF3D6;color:#7F5400;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.ann{padding:18px 20px;margin-bottom:14px}
.ann.unread{border-left:4px solid var(--gold)}
.annbody{white-space:pre-wrap;margin:8px 0 0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
@media print{.side,.mobilebar,.actions,#toasts,#modal-root,.toolbar button,.icon-btn{display:none!important}.shell{display:block}.page{max-width:none;padding:0}.panel{break-inside:avoid;box-shadow:none}body{background:#fff}}
.pbar{height:8px;background:var(--sage);border-radius:99px;overflow:hidden;min-width:90px;margin-bottom:2px}
.pbar i{display:block;height:100%;background:var(--spruce);border-radius:99px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:9px 18px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--spruce);color:#fff}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:#E9EFF0;border-radius:12px;padding:10px;min-height:140px;align-content:start}
.col h3{font-size:15px;display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 10px}
.acard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:grid;gap:8px}
.acard select{width:100%;min-height:34px;padding:4px 8px;border:1px solid #C9D3D6;border-radius:8px;background:#fff;font-size:14px}
.linkbtn{background:none;border:0;padding:0;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;font-size:15px}
.linkbtn:hover{text-decoration:underline}
.modal .tot td{font-weight:700;border-top:2px solid var(--ink)}
.modal th[colspan]{padding-top:14px;color:var(--ink)}
.panel-head select{min-height:36px;padding:4px 10px;border:1px solid #C9D3D6;border-radius:8px;background:#fff}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .shell.menu-open .side{transform:none}
  .shell.menu-open::after{content:"";position:fixed;inset:0;background:rgba(9,44,45,.4);z-index:30}
  .shell.menu-open .side{z-index:40}
  .mobilebar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--spruce);color:#fff;position:sticky;top:0;z-index:20}
  .mobilebar .icon-btn{color:#fff}
  .mobilebar .brand{padding:0;font-size:18px}
  .page{padding:20px 16px 56px}
  .stat-strip{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid-main,.two-col,.grid-2{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .dl dt{border-bottom:0;padding-bottom:0}
  .auth{grid-template-columns:1fr}
  .auth-art{padding:28px 24px}
  .auth-art .art,.auth-art ul{display:none}
  .grid2{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  return zones.map(z => `<option value="${esc(z)}"${z === selected ? ' selected' : ''}>${esc(z)}</option>`).join('');
}

async function loadMemberships() {
  const members = await q(hr.from('org_members').select('id,org_id,role,status,display_name').eq('user_id', state.user.id));
  const ids = members.map(m => m.org_id);
  const orgs = ids.length ? await q(hr.from('organizations').select('*').in('id', ids)) : [];
  const byId = Object.fromEntries(orgs.map(o => [o.id, o]));
  state.memberships = members.filter(m => byId[m.org_id]).map(m => ({ ...m, org: byId[m.org_id] }));
}
async function loadOrgData() {
  const oid = state.org.id, p = perms();
  const [departments, positions, employees, contracts] = await Promise.all([
    q(hr.from('departments').select('*').eq('org_id', oid).order('name')),
    q(hr.from('positions').select('*').eq('org_id', oid).order('title')),
    q(hr.from('employees').select('*').eq('org_id', oid).order('full_name')),
    q(hr.from('contracts').select('*').eq('org_id', oid))
  ]);
  Object.assign(state, { departments, positions, employees, contracts });
  state.me = employees.find(e => e.user_id === state.user.id) || null;
  state.attention = { docs: [] };
  if (p.hr) {
    try {
      state.attention.docs = await q(hr.from('employee_documents').select('id,employee_id,title,expires_on')
        .eq('org_id', oid).not('expires_on', 'is', null).lte('expires_on', addDays(TODAY(), 60)).order('expires_on'));
    } catch {}
  }
  await loadTime();
  await loadPayroll();
  await loadRecruit();
  await loadPerf();
  await loadTrain();
  await loadCompany();
  await loadGate();
  await loadCalls();
}
async function reloadEmployees() {
  state.employees = await q(hr.from('employees').select('*').eq('org_id', state.org.id).order('full_name'));
  state.me = state.employees.find(e => e.user_id === state.user.id) || null;
}
async function reloadStructure() {
  [state.departments, state.positions] = await Promise.all([
    q(hr.from('departments').select('*').eq('org_id', state.org.id).order('name')),
    q(hr.from('positions').select('*').eq('org_id', state.org.id).order('title'))
  ]);
}
async function reloadContracts() { state.contracts = await q(hr.from('contracts').select('*').eq('org_id', state.org.id)); }

async function loadDetail(id) {
  const e = findEmp(id), p = perms();
  const self = !!e && e.user_id === state.user.id;
  const d = state.detail = { id, priv:null, docs:[], balances:[], loaded:false, error:null };
  try {
    const jobs = [];
    if (p.pay || self) jobs.push(hr.from('employee_private').select('*').eq('employee_id', id).maybeSingle().then(r => { if (r.error) throw r.error; d.priv = r.data; }));
    if (p.hr || self) jobs.push(hr.from('employee_documents').select('*').eq('employee_id', id).order('created_at', { ascending:false }).then(r => { if (r.error) throw r.error; d.docs = r.data || []; }));
    const mgr = !!state.me && !!e && e.manager_id === state.me.id;
    if (state.hasTime && (p.hr || self || mgr)) jobs.push(hr.rpc('leave_balance', { p_employee:id, p_year:new Date().getFullYear() }).then(r => { if (r.error) throw r.error; d.balances = r.data || []; }));
    await Promise.all(jobs);
  } catch (err) { d.error = friendly(err); }
  d.loaded = true;
  if (state.detail === d && ['employee', 'me'].includes(state.view)) renderView();
}
async function loadTeam() {
  const t = state.team; if (t.loading) return;
  t.loading = true;
  try {
    const oid = state.org.id;
    const [members, invitations] = await Promise.all([
      q(hr.from('org_members').select('*').eq('org_id', oid).order('created_at')),
      q(hr.from('invitations').select('*').eq('org_id', oid).order('created_at', { ascending:false }))
    ]);
    t.members = members; t.invitations = invitations; t.error = null;
  } catch (err) { t.error = friendly(err); }
  t.loaded = true; t.loading = false;
  if (state.view === 'team') renderView();
}
async function loadAudit() {
  const a = state.audit; if (a.loading) return;
  a.loading = true;
  try {
    if (!state.team.loaded) await loadTeam();
    a.rows = await q(hr.from('audit_log').select('*').eq('org_id', state.org.id).order('created_at', { ascending:false }).limit(100));
    a.error = null;
  } catch (err) { a.error = friendly(err); }
  a.loaded = true; a.loading = false;
  if (state.view === 'audit') renderView();
}

/* =====================================================================
   VIEW: DASHBOARD
   ===================================================================== */
function viewDashboard() {
  const p = perms();
  const current = state.employees.filter(e => !EXITED.includes(e.status));
  const todayIso = TODAY();
  const awayIds = new Set(current.filter(e => e.status === 'on_leave').map(e => e.id));
  state.leaveRequests.filter(r => r.status === 'approved' && r.start_date <= todayIso && r.end_date >= todayIso).forEach(r => awayIds.add(r.employee_id));
  const onLeave = current.filter(e => awayIds.has(e.id)).length;
  const since = addDays(TODAY(), -30), since90 = addDays(TODAY(), -90);
  const joined = current.filter(e => e.hire_date && e.hire_date >= since).length;
  const left = state.employees.filter(e => EXITED.includes(e.status) && e.exit_date && e.exit_date >= since90).length;
  const add = p.hr ? `<button class="btn primary" data-action="add-emp">${icon('plus')} Add employee</button>` : '';
  if (!state.employees.length) {
    return pageHead('Dashboard', state.org.name, add) + `<div class="panel empty"><h3>No employees yet</h3><p>Add your first employee to start building your people records.</p>${p.hr ? `<button class="btn primary" data-action="add-emp">${icon('plus')} Add employee</button>` : ''}</div>`;
  }
  const counts = {};
  current.forEach(e => { const k = e.department_id ? deptName(e.department_id) : 'No department'; counts[k] = (counts[k] || 0) + 1; });
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  const bars = rows.map(([k, n]) => `<div class="bar-row"><span class="lbl" title="${esc(k)}">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n / max * 100)}%"></div></div><span class="n">${n}</span></div>`).join('');

  const today = TODAY(), soon = addDays(today, 60), att = [];
  if (p.pay) state.contracts.filter(c => c.status === 'active' && c.end_date && c.end_date <= soon).forEach(c => {
    att.push({ date:c.end_date, emp:c.employee_id, text:'Contract', late:c.end_date < today });
  });
  if (p.hr) state.attention.docs.forEach(d => att.push({ date:d.expires_on, emp:d.employee_id, text:d.title, late:d.expires_on < today }));
  if (state.hasTrain && p.hr) state.trainRecords.filter(r => r.status === 'completed' && r.expires_on && r.expires_on <= soon && !r.certificate_path).forEach(r => att.push({ date:r.expires_on, emp:r.employee_id, text:r.title, late:r.expires_on < today }));
  att.sort((a, b) => a.date.localeCompare(b.date));
  const pendingN = state.hasTime ? state.leaveRequests.filter(canDecide).length : 0;
  const attItems = att.slice(0, 8).map(a => `<li><button data-action="open-emp" data-id="${esc(a.emp)}"><span><span class="an">${esc(findEmp(a.emp)?.full_name || 'Employee')}</span><br><span class="muted small">${esc(a.text)} ${a.late ? 'expired' : 'expires'} ${esc(fmtDate(a.date))}</span></span>${chip(a.late ? 'Overdue' : 'Soon', a.late ? 'bad' : 'warn')}</button></li>`);
  if (pendingN) attItems.unshift(`<li><button data-action="nav" data-view="leave"><span><span class="an">${pendingN} leave request${pendingN === 1 ? '' : 's'} waiting</span><br><span class="muted small">Review and decide</span></span>${chip('Review', 'warn')}</button></li>`);
  if (state.hasPayroll && p.admin) state.runs.filter(r => r.status === 'draft' && r.calculated_at).forEach(r => attItems.unshift(`<li><button data-action="open-run" data-id="${esc(r.id)}"><span><span class="an">Payroll for ${esc(r.label)} is waiting for approval</span><br><span class="muted small">Review and approve</span></span>${chip('Review', 'warn')}</button></li>`));
  if (state.hasPerf) {
    const li = (n, msg, sub, view) => `<li><button data-action="nav" data-view="${view}"><span><span class="an">${n} ${msg}</span><br><span class="muted small">${sub}</span></span>${chip('Review', 'warn')}</button></li>`;
    const openC = new Set(state.cycles.filter(c => c.status === 'open').map(c => c.id));
    const myA = state.me ? state.appraisals.filter(a => a.employee_id === state.me.id && openC.has(a.cycle_id) && !a.self_submitted_at).length : 0;
    const toWrite = state.appraisals.filter(a => openC.has(a.cycle_id) && a.status !== 'completed' && !mgrReviewOf(a.id) && (p.hr ? (!state.me || a.employee_id !== state.me.id) : isMgrOf(findEmp(a.employee_id)))).length;
    const ready = p.hr ? state.appraisals.filter(a => a.status === 'ready').length : 0;
    if (ready) attItems.unshift(li(ready, ready === 1 ? 'appraisal ready to finalize' : 'appraisals ready to finalize', 'Open Performance', 'performance'));
    if (toWrite) attItems.unshift(li(toWrite, toWrite === 1 ? 'review to write' : 'reviews to write', 'Open Performance', 'performance'));
    if (myA) attItems.unshift(li(myA, myA === 1 ? 'self review to write' : 'self reviews to write', 'Open Performance', 'performance'));
  }
  const newApps = state.hasRecruit && p.hr ? state.applicants.filter(a => a.stage === 'applied').length : 0;
  if (newApps) attItems.unshift(`<li><button data-action="nav" data-view="recruitment"><span><span class="an">${newApps} new applicant${newApps === 1 ? '' : 's'} to review</span><br><span class="muted small">Open the recruitment pipeline</span></span>${chip('Review', 'warn')}</button></li>`);
  const attn = attItems.length ? `<ul class="attn">${attItems.join('')}</ul>` : `<p class="muted">Nothing needs attention right now.</p>`;
  const setupNote = (file, what) => `<div class="panel pad" style="margin-bottom:20px;border-color:#E8C56A;background:#FFF8E6"><b>${what} are in the app but not switched on yet.</b><p class="muted" style="margin-top:4px">Run <code>${file}</code> in the Supabase SQL Editor to add them.</p></div>`;
  const banner = p.admin ? (state.timeError === 'missing' ? setupNote('hrms_phase2_leave_attendance.sql', 'Leave and attendance') : (state.payError === 'missing' ? setupNote('hrms_phase3_payroll.sql', 'Payroll and payslips') : (state.recruitError === 'missing' ? setupNote('hrms_phase4_recruitment.sql', 'Recruitment tools') : ((state.perfError === 'missing' || state.trainError === 'missing') ? setupNote('hrms_phase5_performance_training.sql', 'Performance and training tools') : (state.companyError === 'missing' ? setupNote('hrms_phase6_company_selfservice.sql', 'Announcements and the company hub') : (state.gateError === 'missing' ? setupNote('hrms_phase7_gate_attendance.sql', 'Gate attendance') : (state.callsError === 'missing' ? setupNote('hrms_phase8_calls_meetings.sql', 'Calls and meetings') : ''))))))) : '';

  const o = state.org;
  const cap = o.max_employees;
  const used = current.length;
  const daysLeft = o.trial_ends_at ? Math.max(0, Math.ceil((new Date(o.trial_ends_at) - new Date()) / 86400000)) : null;
  const plan = p.admin ? `<div class="panel pad" style="margin-top:20px"><h3 style="margin-bottom:6px">Your plan</h3>
    <p>${o.status === 'trial' ? `Free trial${daysLeft != null ? `, ${daysLeft} day${daysLeft === 1 ? '' : 's'} left` : ''}` : esc(o.plan_key)}</p>
    <div class="meter" role="img" aria-label="${used} of ${cap ?? 'unlimited'} employees"><i style="width:${cap ? Math.min(100, Math.round(used / cap * 100)) : 0}%"></i></div>
    <p class="muted small">${used} of ${cap ?? 'unlimited'} employees used</p></div>` : '';

  return pageHead('Dashboard', state.org.name, add) + banner + `
  <div class="panel stat-strip">
    <div class="stat"><b>${current.length}</b><span>People employed</span></div>
    <div class="stat"><b>${onLeave}</b><span>On leave now</span></div>
    <div class="stat"><b>${joined}</b><span>Joined in 30 days</span></div>
    <div class="stat"><b>${left}</b><span>Left in 90 days</span></div>
  </div>
  <div class="grid-main">
    <section class="panel pad"><h3 style="margin-bottom:16px">People by department</h3><div class="bars">${bars || '<p class="muted">No data yet.</p>'}</div></section>
    <div><section class="panel pad"><h3 style="margin-bottom:8px">Needs attention</h3>${attn}</section>${plan}</div>
  </div>`;
}

function employeeList(reportsOnly) {
  const f = state.filters, term = (f.q || '').toLowerCase();
  return state.employees.filter(e => {
    if (reportsOnly && (!state.me || e.manager_id !== state.me.id)) return false;
    if (f.dept && e.department_id !== f.dept) return false;
    if (f.status === 'current' && EXITED.includes(e.status)) return false;
    if (f.status === 'exited' && !EXITED.includes(e.status)) return false;
    if (['active', 'on_leave', 'suspended'].includes(f.status) && e.status !== f.status) return false;
    if (term && !`${e.full_name} ${e.employee_no || ''} ${e.work_email || ''} ${e.phone || ''}`.toLowerCase().includes(term)) return false;
    return true;
  });
}

function exportCsv() {
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ['Employee number','Full name','Gender','Work email','Phone','Department','Position','Reports to','Employment type','Status','Hire date','Exit date'];
  const rows = state.employees.map(e => [e.employee_no, e.full_name, e.gender, e.work_email, e.phone, e.department_id ? deptName(e.department_id) : '',
    e.position_id ? posTitle(e.position_id) : '', e.manager_id ? findEmp(e.manager_id)?.full_name : '', EMP_TYPES[e.employment_type], STATUSES[e.status], e.hire_date, e.exit_date]);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `employees-${TODAY()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const weekendDays = () => { const w = state.org.settings?.weekend_days; return Array.isArray(w) ? w.map(Number) : [6, 7]; };
const isoDow = iso => { const n = new Date(iso + 'T00:00:00').getDay(); return n === 0 ? 7 : n; };
function workingDaysBetween(a, b) {
  if (!a || !b || b < a) return 0;
  const hol = new Set(state.holidays.map(h => h.holiday_date)), wk = weekendDays();
  let n = 0, d = a, guard = 0;
  while (d <= b && guard++ < 400) { if (!wk.includes(isoDow(d)) && !hol.has(d)) n++; d = addDays(d, 1); }
  return n;
}

      q(hr.from('holidays').select('*').eq('org_id', oid).order('holiday_date')),
      q(hr.from('shifts').select('*').eq('org_id', oid).order('name')),
      q(hr.from('leave_requests').select('*').eq('org_id', oid).gte('end_date', addDays(TODAY(), -400)).order('start_date', { ascending:false }).limit(1000))
    ]);

    state.hasTime = false;
    state.timeError = /PGRST205|42P01|schema cache|does not exist/i.test(`${err?.code} ${err?.message}`) ? 'missing' : friendly(err);

function viewAttendance() {
  const p = perms(), a = state.att, me = state.me;
  if (!a.loaded && !a.loading) loadAttendance();
  const today = orgToday();
  const isMgr = !!me && state.employees.some(e => e.manager_id === me.id);
  const acts = p.hr ? `<button class="btn" data-action="record-att">${icon('edit')} Record a day</button>` : '';

  let clock = '';
  if (me && !selfClockOn()) clock = `<div class="panel clockcard"><div><div class="big">Attendance is recorded at the gate</div><div class="muted">Scan your card when you arrive and when you leave. Your record appears below.</div></div></div>`;
  else if (me) {
    if (!a.loaded) clock = `<div class="panel clockcard">${loadBlock()}</div>`;
    else {
      const rec = a.mine.find(r => r.work_date === today);
      let info, btn = '';
      if (!rec) { info = `<div class="big">Not clocked in</div><div class="muted">${esc(fmtDate(today))}</div>`; btn = `<button class="btn primary" data-action="clock-in">${icon('clock')} Clock in</button>`; }
      else if (!rec.clock_out) { info = `<div class="big">In since ${esc(fmtTime(rec.clock_in))}</div><div class="muted">${rec.minutes_late > 0 ? `${rec.minutes_late} minutes late` : 'On time'}</div>`; btn = `<button class="btn primary" data-action="clock-out">${icon('clock')} Clock out</button>`; }
      else info = `<div class="big">Done for today</div><div class="muted">${esc(fmtTime(rec.clock_in))} to ${esc(fmtTime(rec.clock_out))}, ${esc(fmtMins(rec.worked_minutes))}</div>`;
      clock = `<div class="panel clockcard"><div>${info}</div><div>${btn}</div></div>`;
    }
  }
  if (a.error) clock += `<div class="form-error">${esc(a.error)}</div>`;

  const mineRows = a.mine.map(r => `<tr><td>${esc(fmtDate(r.work_date))}</td><td>${esc(fmtTime(r.clock_in))}</td><td>${esc(fmtTime(r.clock_out))}</td><td>${esc(fmtMins(r.worked_minutes))}</td><td>${r.minutes_late > 0 ? chip(`${r.minutes_late} min late`, 'warn') : (r.clock_in ? chip('On time', 'ok') : '')}</td></tr>`).join('');
  const mineHtml = me && a.loaded ? `<section class="panel"><div class="panel-head"><h3>My last 30 days</h3></div>${mineRows ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Arrival</th></tr></thead><tbody>${mineRows}</tbody></table></div>` : '<div class="empty"><p>No attendance recorded yet.</p></div>'}</section>` : '';

  let todayHtml = '';
  if ((p.hr || isMgr) && a.loaded) {
    const team = state.employees.filter(e => !EXITED.includes(e.status) && (p.hr || (me && e.manager_id === me.id)));
    const away = new Set(state.leaveRequests.filter(r => r.status === 'approved' && r.start_date <= today && r.end_date >= today).map(r => r.employee_id));
    const off = workingDaysBetween(today, today) === 0;
    const rows = team.map(e => {
      const r = a.today.find(x => x.employee_id === e.id);
      let st;
      if (r) st = r.minutes_late > 0 ? chip(`Late by ${r.minutes_late} min`, 'warn') : chip('On time', 'ok');
      else if (away.has(e.id)) st = chip('On leave');
      else if (off) st = chip('Day off');
      else st = chip('Not in yet');
      return `<tr><td><div class="who">${avatar(e.full_name)}<b>${esc(e.full_name)}</b></div></td><td>${st}</td><td>${esc(fmtTime(r?.clock_in))}</td><td>${esc(fmtTime(r?.clock_out))}</td></tr>`;
    }).join('');
    todayHtml = `<section class="panel"><div class="panel-head"><h3>${p.hr ? 'Everyone today' : 'My team today'}</h3><span class="muted small">${esc(fmtDate(today))}</span></div>${rows ? `<div class="tablewrap"><table><thead><tr><th>Person</th><th>Status</th><th>In</th><th>Out</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty"><p>No one to show.</p></div>'}</section>`;
  }

  let reportHtml = '';
  if (p.hr || isMgr) {
    const rp = a.report;
    const body = rp ? (rp.rows.length ? `<div class="tablewrap"><table><thead><tr><th>Person</th><th>Working days</th><th>Present</th><th>Late days</th><th>Minutes late</th><th>On leave</th><th>Absent</th></tr></thead><tbody>${rp.rows.map(r => `<tr><td><b>${esc(r.full_name)}</b></td><td>${fmtDays(r.working_days)}</td><td>${r.present_days}</td><td>${r.late_days}</td><td>${r.minutes_late}</td><td>${fmtDays(r.leave_days)}</td><td>${Number(r.absent_days) > 0 ? chip(fmtDays(r.absent_days), 'warn') : '0'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><p>No one to report on for these dates.</p></div>') : '<div class="panel-body muted">Choose a date range and select Show report.</div>';
    reportHtml = `<section class="panel"><div class="panel-head"><h3>Attendance report</h3>${rp && rp.rows.length ? `<button class="btn sm" data-action="export-att">${icon('download', 16)} Export CSV</button>` : ''}</div>
      <form data-form="att-report" class="toolbar"><div class="form-error" role="alert" hidden style="flex-basis:100%;margin:0"></div>
        <label class="row" style="gap:8px">From <input type="date" name="from" value="${esc(a.from)}" required></label>
        <label class="row" style="gap:8px">To <input type="date" name="to" value="${esc(a.to)}" required></label>
        <button class="btn sm primary" type="submit">Show report</button></form>${body}</section>`;
  }
  const note = !me && !p.hr && !isMgr ? '<div class="panel empty"><h3>Your login is not linked to an employee record yet</h3><p>Ask HR to link it, then you can clock in here.</p></div>' : '';
  return pageHead('Attendance', 'Clock in, and see who is in today', acts) + clock + `<div class="stack">${note}${mineHtml}${myScansHtml()}${todayHtml}${reportHtml}</div>`;
}

async function loadPayroll() {
  const oid = state.org.id;
  Object.assign(state, { runs:[], payComponents:[], taxBands:[], payItems:[], payslips:[] });

  const seg = `<div class="seg" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-action="rec-tab" data-tab="${k}" aria-pressed="${state.recTab === k}">${l}</button>`).join('')}</div>`;
  const acts = state.recTab === 'jobs' ? `<button class="btn primary" data-action="add-job">${icon('plus')} New job posting</button>`
    : state.recTab === 'pipeline' ? `<button class="btn primary" data-action="add-applicant">${icon('plus')} Add applicant</button>` : '';
  const body = state.recTab === 'jobs' ? jobsTab() : state.recTab === 'interviews' ? interviewsTab() : pipelineTab();
  return pageHead('Recruitment', 'From job posting to first day', acts) + `<div style="margin-bottom:16px">${seg}</div>` + body;
}
function applicantCard(a) {
  const nIv = state.interviews.filter(i => i.applicant_id === a.id && i.status === 'scheduled').length;
  return `<div class="acard"><div><button class="linkbtn" data-action="open-applicant" data-id="${esc(a.id)}">${esc(a.full_name)}</button><div class="muted small">${esc(jobTitleOf(a.posting_id))}</div></div>
    <div class="row small">${a.rating ? `<span title="Rating" style="color:#B7791F">${stars(a.rating)}</span>` : ''}${chip(SOURCES[a.source] || a.source)}${nIv ? chip(`${nIv} interview${nIv === 1 ? '' : 's'}`, 'warn') : ''}</div>
    <select data-input="move-stage" data-id="${esc(a.id)}" aria-label="Move ${esc(a.full_name)} to another stage">${opts(MOVE_STAGES, a.stage)}</select></div>`;
}
function pipelineTab() {
  if (!state.jobs.length) return `<div class="panel empty"><h3>Start with a job posting</h3><p>Create a job, then add the people who apply and move them through the stages.</p><button class="btn primary" data-action="add-job">${icon('plus')} New job posting</button></div>`;
  const list = state.applicants.filter(a => !state.pipeJob || a.posting_id === state.pipeJob);
  const filter = `<div class="toolbar" style="border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:16px"><select data-input="pipe-job" aria-label="Job">${listOpts(state.jobs, 'id', 'title', state.pipeJob, 'All jobs')}</select><span class="muted small">${list.filter(a => STAGES[a.stage]).length} in the pipeline</span></div>`;
  const cols = Object.entries(STAGES).map(([k, l]) => { const items = list.filter(a => a.stage === k);
    return `<section class="col" aria-label="${esc(l)}"><h3>${esc(l)} <span class="muted small">${items.length}</span></h3>${items.map(applicantCard).join('') || '<p class="muted small" style="padding:4px 6px">No one here</p>'}</section>`; }).join('');
  const closed = list.filter(a => !STAGES[a.stage]);
  const closedHtml = closed.length ? `<section class="panel" style="margin-top:20px"><div class="panel-head"><h3>Hired, rejected and withdrawn</h3><button class="btn sm" data-action="toggle-closed">${state.showClosed ? 'Hide' : `Show ${closed.length}`}</button></div>
    ${state.showClosed ? runTable('<th>Name</th><th>Job</th><th>Outcome</th><th></th>', closed.map(a => `<tr><td><button class="linkbtn" data-action="open-applicant" data-id="${esc(a.id)}">${esc(a.full_name)}</button></td><td>${esc(jobTitleOf(a.posting_id))}</td>
      <td>${chip(ALL_STAGES[a.stage], a.stage === 'hired' ? 'ok' : 'neutral')}${a.rejected_reason ? `<div class="muted small">${esc(a.rejected_reason)}</div>` : ''}</td>
      <td class="right">${a.stage !== 'hired' ? `<button class="btn sm ghost" data-action="reopen-applicant" data-id="${esc(a.id)}">Reopen</button>` : ''}</td></tr>`).join('')) : ''}</section>` : '';
  return filter + `<div class="board">${cols}</div>` + closedHtml;
}
function jobsTab() {
  const rows = state.jobs.map(j => { const apps = state.applicants.filter(a => a.posting_id === j.id), hired = apps.filter(a => a.stage === 'hired').length, active = apps.filter(a => STAGES[a.stage]).length;

function interviewsTab() {
  const rows = state.interviews.slice().sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at)).map(i => interviewRow(i, true)).join('');

function interviewRow(i, hrView) {
  const who = i.interviewer_id ? findEmp(i.interviewer_id)?.full_name || 'Interviewer' : 'Not assigned';
  const result = i.status === 'completed' ? `<div class="small" style="margin-top:4px">${i.score ? `<span style="color:#B7791F">${stars(i.score)}</span> ` : ''}${chip(RECOMMEND[i.recommendation] || '', recTone(i.recommendation))}</div>${i.feedback ? `<div class="muted small">${esc(i.feedback)}</div>` : ''}` : '';
  const acts = [];
  if (i.status !== 'cancelled') acts.push(`<button class="btn sm ${i.status === 'scheduled' ? 'primary' : ''}" data-action="give-feedback" data-id="${esc(i.id)}">${i.status === 'completed' ? 'Edit feedback' : 'Give feedback'}</button>`);
  if (hrView && i.status === 'scheduled') acts.push(`<button class="icon-btn" data-action="edit-interview" data-id="${esc(i.id)}" aria-label="Edit interview">${icon('edit', 16)}</button><button class="icon-btn danger" data-action="cancel-interview" data-id="${esc(i.id)}" aria-label="Cancel interview">${icon('x', 16)}</button>`);
  return `<tr><td style="white-space:nowrap">${esc(fmtWhen(i.scheduled_at))}<div class="muted small">${i.duration_minutes} min</div></td>
    <td><b>${esc(i.applicant_name)}</b><div class="muted small">${esc(i.job_title)}</div></td>
    ${hrView ? `<td>${esc(who)}</td>` : ''}<td>${esc(IV_MODE[i.mode] || i.mode)}${i.location ? `<div class="muted small">${esc(i.location)}</div>` : ''}</td>
    <td>${chip(IV_STATUS[i.status], ivTone(i.status))}${result}</td><td class="right">${acts.join(' ')}</td></tr>`;
}
function viewMyInterviews() {
  const list = myInterviews().slice().sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

function openApplicant(id) {
  const a = appById(id); if (!a) return;
  const ivs = state.interviews.filter(i => i.applicant_id === id).sort((x, y) => new Date(y.scheduled_at) - new Date(x.scheduled_at));
  const active = !!STAGES[a.stage];
  const btns = [`<button type="button" class="btn" data-action="edit-applicant" data-id="${esc(id)}">${icon('edit', 16)} Edit</button>`];
  if (active) btns.push(`<button type="button" class="btn" data-action="schedule-interview" data-id="${esc(id)}">${icon('calendar', 16)} Schedule interview</button>`, `<button type="button" class="btn primary" data-action="hire-applicant" data-id="${esc(id)}">Hire</button>`, `<button type="button" class="btn danger" data-action="reject-applicant" data-id="${esc(id)}">Reject</button>`);

  btns.push(`<button type="button" class="btn ghost danger" data-action="delete-applicant" data-id="${esc(id)}">${icon('trash', 16)} Delete</button>`);
  openModal({ title: a.full_name, wide:true, hideFooter:true, body: `<div class="row" style="margin-bottom:14px">${btns.join('')}</div>

async function uploadResume(id, file) {
  if (file.size > 10 * 1024 * 1024) throw new Error('That file is larger than 10 MB.');
  const path = `${state.org.id}/candidates/${id}/${Date.now()}-${file.name.replace(/[^\w.\-]+/g, '_')}`;
  const up = await sb.storage.from('hr-documents').upload(path, file, { contentType: file.type || undefined, upsert:false });
  if (up.error) throw up.error;
  const old = appById(id)?.resume_path;
  await q(hr.from('applicants').update({ resume_path: path }).eq('id', id));
  if (old) { try { await sb.storage.from('hr-documents').remove([old]); } catch {} }
}

const GOAL_STATUS = { not_started:'Not started', in_progress:'In progress', done:'Done', cancelled:'Cancelled' };
const goalTone = s => ({ in_progress:'warn', done:'ok' }[s] || 'neutral');
const CYCLE_STATUS = { draft:'Draft', open:'Open', closed:'Closed' };
const TRAIN_STATUS = { planned:'Planned', in_progress:'In progress', completed:'Completed' };
const RATING_LABEL = { 1:'1 - Needs improvement', 2:'2 - Below expectations', 3:'3 - Meets expectations', 4:'4 - Exceeds expectations', 5:'5 - Outstanding' };
const mgrReviewOf = id => state.mgrReviews.find(m => m.appraisal_id === id);
const cycleById = id => state.cycles.find(c => c.id === id);
const isMgrOf = e => !!state.me && !!e && e.manager_id === state.me.id;
const isManager = () => !!state.me && state.employees.some(e => e.manager_id === state.me.id);
const pbar = n => `<div class="pbar" role="img" aria-label="${n}% complete"><i style="width:${Math.max(0, Math.min(100, n))}%"></i></div>`;
const activePeople = () => state.employees.filter(e => !EXITED.includes(e.status));

/* ---------- loading ---------- */
async function loadPerf() {
  const oid = state.org.id;
  Object.assign(state, { cycles:[], appraisals:[], mgrReviews:[], goals:[] });
  try {
    const [cycles, appraisals, mgrReviews, goals] = await Promise.all([
      q(hr.from('review_cycles').select('*').eq('org_id', oid).order('period_start', { ascending:false })),
      q(hr.from('appraisals').select('*').eq('org_id', oid).order('employee_name')),
      q(hr.from('appraisal_manager_reviews').select('*').eq('org_id', oid)),
      q(hr.from('goals').select('*').eq('org_id', oid).order('target_date', { ascending:true, nullsFirst:false }))
    ]);
    Object.assign(state, { cycles, appraisals, mgrReviews, goals, hasPerf:true, perfError:null });
  } catch (err) {
    state.hasPerf = false;
    state.perfError = /PGRST205|42P01|schema cache|does not exist/i.test(`${err?.code} ${err?.message}`) ? 'missing' : friendly(err);
  }
}
async function loadTrain() {
  const oid = state.org.id;
  Object.assign(state, { courses:[], trainRecords:[] });
  try {
    const [courses, trainRecords] = await Promise.all([
      q(hr.from('training_courses').select('*').eq('org_id', oid).order('title')),
      q(hr.from('training_records').select('*').eq('org_id', oid).order('created_at', { ascending:false }).limit(2000))
    ]);
    Object.assign(state, { courses, trainRecords, hasTrain:true, trainError:null });
  } catch (err) {
    state.hasTrain = false;
    state.trainError = /PGRST205|42P01|schema cache|does not exist/i.test(`${err?.code} ${err?.message}`) ? 'missing' : friendly(err);
  }
}
async function reloadPerf() { await loadPerf(); renderShell(); }
async function reloadTrain() { await loadTrain(); renderShell(); }

/* ---------- PERFORMANCE VIEW ---------- */
function perfTabs() {
  const p = perms(), t = [];
  if (state.me) t.push(['mine', 'My performance']);
  if (isManager() || p.hr) t.push(['team', p.hr ? 'Everyone' : 'My team']);
  if (p.hr) t.push(['cycles', 'Review cycles']);
  if (!t.some(x => x[0] === state.perfTab)) state.perfTab = t[0] ? t[0][0] : 'mine';
  return t;
}
function goalRows(list, who) {
  return list.map(g => { const e = findEmp(g.employee_id);

function monthsBack(n) {
  const out = [], now = new Date();

    const d = new Date(now.getFullYear(), now.getMonth() - i, 1), e = new Date(d.getFullYear(), d.getMonth() + 1, 0);

function barChart(labels, series, o = {}) {
  const W = 680, H = 210, L = 40, R = 8, T = 14, B = 30, n = Math.max(1, labels.length);
  const max = Math.max(1, ...series.flatMap(s => s.data));
  const top = max <= 10 ? Math.max(2, Math.ceil(max / 2) * 2) : niceMax(max);
  const gw = (W - L - R) / n, bw = Math.max(4, Math.min(30, (gw - 6) / series.length));
  let g = '';
  for (let i = 0; i <= 2; i++) {
    const v = top * i / 2, y = T + (H - T - B) * (1 - i / 2);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#E3EAEC"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#5A6A6F">${fmtAxis(v)}</text>`;
  }
  series.forEach((s, si) => s.data.forEach((v, i) => {
    const h = (H - T - B) * v / top, x = L + gw * i + (gw - bw * series.length) / 2 + bw * si;
    g += `<rect x="${x}" y="${H - B - h}" width="${bw - 1}" height="${Math.max(h, 0)}" rx="2" fill="${s.color}"><title>${esc(labels[i])}: ${esc(s.name)} ${fmtAxis(v)}</title></rect>`;
  }));

async function callLogins(body) {
  const { data, error } = await sb.functions.invoke('hrms-create-logins', { body });
  if (error) {
    let msg = '';
    try { const j = await error.context.json(); msg = (j && j.error) || ''; } catch {}
    if (!msg) msg = /not found|404|fetch|relay|Failed to send/i.test(`${error.name} ${error.message}`)
      ? 'The login service is not set up yet. In Supabase, deploy the "hrms-create-logins" function (see the setup steps), then try again.' : (error.message || 'Something went wrong.');
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function afterLogins() {
  await reloadEmployees(); await loadMemberships();
  state.org = state.memberships.find(m => m.org_id === state.org.id).org;

}

async function loadGate() {

    state.attSettings = await q(hr.from('attendance_settings').select('*').eq('org_id', oid).maybeSingle());

      ]);
      Object.assign(state, { gates, creds, scans });

}

const C39 = { '0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
  A:'wnnnnwnnw',B:'nnwnnwnnw',C:'wnwnnwnnn',D:'nnnnwwnnw',E:'wnnnwwnnn',F:'nnwnwwnnn','*':'nwnnwnwnn' };
function code39Svg(text) {
  let x = 0, bars = ''; const N = 2, W = 5;
  for (const ch of '*' + String(text).toUpperCase() + '*') { const p = C39[ch]; if (!p) continue; for (let i = 0; i < 9; i++) { const w = p[i] === 'w' ? W : N; if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="50" fill="#000"/>`; x += w; } x += N; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x} 50" preserveAspectRatio="none" style="width:100%;height:14mm">${bars}</svg>`;
}
function codeSvg(token) {
  try { if (window.qrcode) { const qr = window.qrcode(0, 'M'); qr.addData('HRMS:' + token); qr.make(); return qr.createSvgTag({ cellSize: 3, margin: 0, scalable: true }); } } catch {}
  return code39Svg(token);
}

const callsOn = () => !!(state.hasCalls && state.callSettings && state.callSettings.enabled);

async function loadCalls() {
  Object.assign(state, { callSettings:null, callDir:[], callHist:[], meetings:[], canSchedule:false });
  try {

/* ---------- ringing ---------- */

const forms = {
  signin: async d => {
    let email = d.email;
    if (state.loginMode === 'staff') { const code = normId(d.org_code); email = `${normId(d.staff_id)}@${code}.staff.hrms`; try { localStorage.setItem('hrms_org_code', code); } catch {} }
    const { error } = await sb.auth.signInWithPassword({ email, password: d.password });
    if (error) throw new Error(/invalid login/i.test(error.message) && state.loginMode === 'staff' ? 'Those details are not right. Check the organization code, staff ID and password, or ask HR to reset your password.' : error.message);
  },
  setpw: async d => {
    if (d.password !== d.password2) throw new Error('The two passwords do not match.');
    if (String(d.password).length < 8) throw new Error('Use at least 8 characters.');
    const { error } = await sb.auth.updateUser({ password: d.password, data: { must_change_password: false } }); if (error) throw error;
    state.authMode = 'signin'; toast('Password saved.'); scheduleBoot();
  },
  signup: async d => {
    const { data, error } = await sb.auth.signUp({ email: d.email, password: d.password, options: { data: { app:'hrms', full_name: d.full_name }, emailRedirectTo: redirectUrl() } });
    if (error) throw error;
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('An account with this email already exists. Try signing in instead.');
    if (data.session) return;
    state.pendingEmail = d.email; state.authMode = 'check-email'; renderAuth();
  },
  forgot: async d => {
    const { error } = await sb.auth.resetPasswordForEmail(d.email, { redirectTo: redirectUrl() }); if (error) throw error;
    toast('If that email has an account, a reset link is on its way.'); state.authMode = 'signin'; renderAuth();
  },
  recovery: async d => {
    if (d.password !== d.password2) throw new Error('The two passwords do not match.');
    const { error } = await sb.auth.updateUser({ password: d.password }); if (error) throw error;
    state.recovery = false; state.authMode = 'signin';
    try { history.replaceState(null, '', location.pathname); } catch {}
    toast('Password updated.'); scheduleBoot();
  },
  createOrg: async d => {
    const { data, error } = await hr.rpc('create_organization', { p_name:d.name, p_currency:(d.currency || '').toUpperCase(), p_country:d.country, p_industry:d.industry, p_timezone:d.timezone, p_owner_name:d.owner_name });

    await loadMemberships(); await enterOrg(data);
  },
  settings: async d => {
    await q(hr.from('organizations').update({ name:d.name, industry:d.industry, country:d.country, timezone:d.timezone }).eq('id', state.org.id));
    await loadMemberships();
    state.org = state.memberships.find(m => m.org_id === state.org.id).org;
    toast('Settings saved.'); renderShell();
  }
};

  'my-details': () => act(async () => { await loadDetail(state.me.id); myDetailsForm(); }),
  'print-slip': el => act(() => { const s = state.payslips.find(x => x.id === el.dataset.id); return s ? printSlips([s]) : null; }),
  'print-run': () => act(() => printSlips(state.run.slips)),
  'bulk-invite': () => bulkInviteForm(),
  'copy-emails': () => copyText(state.lastBulkEmails)
});
Object.assign(inputs, { 'dir-filter': el => { state.directory.q = el.value; const box = $('#dir-table'); if (box) box.innerHTML = dirTableHtml(); } });
actions['print-report'] = () => window.print();
forms['rep-att'] = async d => {
  if (!d.from || !d.to) throw new Error('Choose both dates.');
  if (d.to < d.from) throw new Error('The end date must be on or after the start date.');
  state.rep.from = d.from; state.rep.to = d.to;
  state.rep.rows = await q(hr.rpc('attendance_summary', { p_org: state.org.id, p_from: d.from, p_to: d.to }));
  renderView();
};
Object.assign(actions, {
  'perf-tab': el => { state.perfTab = el.dataset.tab; renderView(); },
  'train-tab': el => { state.trainTab = el.dataset.tab; renderView(); },
  'add-goal': el => goalForm(null, el.dataset.team === '1'),
  'edit-goal': el => goalForm(state.goals.find(g => g.id === el.dataset.id)),
  'delete-goal': el => { if (confirm('Delete this goal?')) act(async () => { await q(hr.from('goals').delete().eq('id', el.dataset.id)); await reloadPerf(); }, 'Goal deleted.'); },
  'open-appraisal': el => openAppraisal(el.dataset.id),
  'self-review': el => selfReviewForm(appById2(el.dataset.id)),
  'manager-review': el => managerReviewForm(appById2(el.dataset.id)),
  'finalize-appraisal': el => finalizeForm(appById2(el.dataset.id)),
  'ack-appraisal': el => ackForm(appById2(el.dataset.id)),
  'add-cycle': () => cycleForm(),
  'edit-cycle': el => cycleForm(cycleById(el.dataset.id)),
  'delete-cycle': el => { if (confirm('Delete this review cycle and all of its appraisals? This cannot be undone.')) act(async () => { await q(hr.from('review_cycles').delete().eq('id', el.dataset.id)); await reloadPerf(); }, 'Review cycle deleted.'); },
  'start-cycle': el => act(async () => { const { data, error } = await hr.rpc('start_review_cycle', { p_cycle: el.dataset.id }); if (error) throw error; await reloadPerf(); toast(`Cycle is open. ${data} new review${data === 1 ? '' : 's'} created.`); }),
  'close-cycle': el => { if (confirm('Close this cycle? People will no longer be able to submit reviews.')) act(async () => { const { error } = await hr.rpc('close_review_cycle', { p_cycle: el.dataset.id }); if (error) throw error; await reloadPerf(); }, 'Review cycle closed.'); },
  'add-course': () => courseForm(),
  'edit-course': el => courseForm(state.courses.find(c => c.id === el.dataset.id)),
  'delete-course': el => { if (confirm('Delete this course? Existing training records are kept.')) act(async () => { await q(hr.from('training_courses').delete().eq('id', el.dataset.id)); await reloadTrain(); }, 'Course deleted.'); },
  'assign-training': () => assignTrainingForm(),
  'complete-train': el => completeTrainForm(state.trainRecords.find(r => r.id === el.dataset.id)),
  'delete-train': el => { if (confirm('Delete this training record?')) act(async () => { await q(hr.from('training_records').delete().eq('id', el.dataset.id)); await reloadTrain(); }, 'Training record deleted.'); }
});

document.addEventListener('submit', async e => {
  const form = e.target, kind = form.dataset?.form; if (!kind) return;
  e.preventDefault();
  const btn = form.querySelector('button[type=submit]');
  const errBox = form.querySelector('.form-error'); if (errBox) errBox.hidden = true;
  if (btn) btn.disabled = true;
  try {
    if (kind === 'modal') { if (modalSubmit) { await modalSubmit(formToObj(form), form); closeModal(); } }
    else if (forms[kind]) await forms[kind](formToObj(form), form);
  } catch (err) { showFormError(form, friendly(err)); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* =====================================================================
   SESSION + BOOT
   ===================================================================== */
function resetSession() {
  Object.assign(state, { user:null, memberships:[], org:null, role:null, me:null, employees:[], departments:[], positions:[], contracts:[], view:'dashboard', authMode:'signin', menuOpen:false });
  closeModal();
  stopCallLoop(); hardStopCall(); clearInterval(state.liveTimer); state.liveTimer = null; DEV.timers.forEach(clearInterval); DEV.timers = []; if (DEV.stream) { try { DEV.stream.getTracks().forEach(t => t.stop()); } catch {} } DEV.camera = false;
}
function renderChooser() {
  $('#app').innerHTML = `<div class="center-screen"><div class="panel pad"><h2>Choose an organization</h2>${state.memberships.map(m => `<button class="btn" data-action="pick-org" data-id="${esc(m.org_id)}">${esc(m.org.name)}</button>`).join('')}</div></div>`;
}
actions['pick-org'] = el => enterOrg(el.dataset.id);

async function enterOrg(orgId) {
  const m = state.memberships.find(x => x.org_id === orgId); if (!m) return;
  state.org = m.org; state.role = m.role;
  try { localStorage.setItem('hrms_org', orgId); } catch {}
  state.team = { members:[], invitations:[], loaded:false, loading:false, error:null };
  state.audit = { rows:[], loaded:false, loading:false, error:null };
  state.filters = { q:'', dept:'', status:'current' };
  state.leave = { balances:[], loaded:false, loading:false, error:null }; state.att = freshAtt(); state.leaveFilter = 'upcoming';
  state.run = { id:null, slips:[], loaded:false, error:null }; state.calcResult = null; state.runId = null; state.perfTab = 'mine'; state.trainTab = 'mine'; state.compTab = 'about'; state.directory = { rows:[], loaded:false, loading:false, q:'', error:null }; state.rep = { from: TODAY().slice(0, 8) + '01', to: TODAY(), rows: null };
  if (!orgUsable(state.org)) { renderLocked(); return; }
  if (state.role === 'gate') { await enterGateDevice(); return; }
  renderLoading('Loading your workspace');
  try { await loadOrgData(); } catch (err) { renderFatal(err); return; }
  startCallLoop();
  go(state.role === 'employee' ? 'home' : 'dashboard');
}

let booting = false, bootTimer = null;
function scheduleBoot() { clearTimeout(bootTimer); bootTimer = setTimeout(boot, 0); }
async function boot() {
  if (booting) return;
  booting = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    state.user = session?.user || null;
    if (!state.user) { renderAuth(); return; }
    if (state.recovery) { renderAuth(); return; }
    if (state.user.user_metadata?.must_change_password) { state.authMode = 'setpw'; renderAuth(); return; }
    renderLoading('Loading your workspace');
    try {
      const inv = await hr.rpc('accept_invitations');
      if (!inv.error && Array.isArray(inv.data) && inv.data.length) state.joined = inv.data.length;
      await loadMemberships();
    } catch (err) { renderFatal(err); return; }
    if (!state.memberships.length) { renderOnboarding(); return; }
    let pick = null; try { pick = localStorage.getItem('hrms_org'); } catch {}
    const m = state.memberships.find(x => x.org_id === pick) || state.memberships[0];
    await enterOrg(m.org_id);
    if (state.joined && state.org) { toast(`You've joined ${state.org.name}.`); state.joined = 0; }
  } catch (err) { renderFatal(err); }
  finally { booting = false; }
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { state.recovery = true; scheduleBoot(); return; }
  if (event === 'SIGNED_OUT') { resetSession(); setTimeout(renderAuth, 0); return; }
  if (event === 'SIGNED_IN' && session && !booting && state.user?.id !== session.user.id) scheduleBoot();
});
boot();
})();
</script>

<script>
/* INSTALL AS AN APP: registers the offline helper and offers an "Install" button */
(() => {
  const KEY = 'hrms_install_dismissed'; let deferred = null;
  const isIos = ua => /iphone|ipad|ipod/i.test(ua || navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch { return false; } };
  const dismissed = () => { try { return localStorage.getItem(KEY) === '1'; } catch { return false; } };
  const remove = () => { const p = document.getElementById('install-pill'); if (p) p.remove(); };
  function show() {
    if (standalone() || dismissed() || document.getElementById('install-pill')) return;
    const el = document.createElement('div'); el.id = 'install-pill';
    el.style.cssText = 'position:fixed;left:16px;bottom:16px;z-index:700;display:flex;align-items:center;gap:4px;background:#0E4142;color:#fff;border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:4px 6px 4px 4px;font:600 14px system-ui,sans-serif';
    el.innerHTML = '<button id="install-go" style="border:0;background:#F0B429;color:#0E4142;border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer">Install PeopleDesk</button><button id="install-x" aria-label="Hide" style="border:0;background:none;color:#fff;font-size:18px;padding:4px 10px;cursor:pointer">\u00d7</button>';
    document.body.appendChild(el);
    el.querySelector('#install-go').onclick = install;
    el.querySelector('#install-x').onclick = () => { try { localStorage.setItem(KEY, '1'); } catch {} remove(); };
  }
  function help() {
    if (document.getElementById('install-help')) return;
    const m = document.createElement('div'); m.id = 'install-help'; m.setAttribute('role', 'dialog');
    m.style.cssText = 'position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px';
    m.innerHTML = '<div style="background:#fff;color:#12302f;border-radius:16px;padding:22px;max-width:360px;font:15px/1.5 system-ui,sans-serif"><h3 style="margin:0 0 8px;font-size:18px">Install PeopleDesk</h3><ol style="padding-left:20px;margin:0 0 14px"><li>Tap the <b>Share</b> button in Safari.</li><li>Choose <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><button id="install-close" style="border:0;background:#0E4142;color:#fff;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer">Got it</button></div>';
    document.body.appendChild(m); m.querySelector('#install-close').onclick = () => m.remove();
  }
  async function install() {
    if (deferred) { const d = deferred; deferred = null; remove(); try { await d.prompt(); await d.userChoice; } catch {} return; }
    help();
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; show(); });
  window.addEventListener('appinstalled', () => { deferred = null; remove(); });
  window.hrmsInstall = install; window.hrmsInstallHelp = help; window.hrmsIsIos = isIos;
  window.addEventListener('load', () => {
    if (isIos() && !standalone()) setTimeout(show, 2500);
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  });
})();
</script>
